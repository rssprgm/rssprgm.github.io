    A multiplayer 2D fighting game with teacher-inspired characters and school
    stages. Presented at CASEX in February 2026.
  group_label: HSR Battlegrounds projects
  rail_id: hsr-rail
  rail_label: HSR Battlegrounds image cards
  rail_class: hsr-rail
  card_class: hsr-card
  media_class: hsr-media
  cards:
    - image: /assets/projects/hsr-battlegrounds/shaderUI.webp
      width: 1920
