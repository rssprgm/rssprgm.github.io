      heading: Shader-driven UI.
      body: GLSL shaders animate interface transitions.
    - image: /assets/projects/hsr-battlegrounds/mechanics.webp
      width: 1920
      height: 1080
      alt: HSR Battlegrounds character abilities preview
      heading: Character abilities.
      body: Each character has a different set of abilities.
    - image: /assets/projects/hsr-battlegrounds/stage.webp
      width: 1920
      height: 1080
