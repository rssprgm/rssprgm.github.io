- id: experience
  question: Do I need experience?
  answer: >-
    No. You can start from zero, bring a project you already care about, or join
    just to see how people build things.

- id: meetings
  question: When and where are meetings?
  answer: >-
    We meet every other Friday at lunch in Room 207. Visit the
    <a href="/meetings.html">Meetings page</a> for past sessions, slides,
    notes, and resources.

- id: rhs-app
  question: How can I download the RHS App?
  answer: >-
    RHS App remains available through a private TestFlight beta. The district
    declined approval without providing a clear explanation. Club members can
    ask to join the beta at a meeting.

- id: rhs-android
  question: Is there an Android version of the RHS App?
  answer: >-
    There is no Android version. The iOS beta requires iOS 26 or later.

- id: projects
  question: What kind of things can we build?
  answer: >-
    Apps, games, websites, automation tools, and design prototypes. You can also
    practice programming contest problems.

- id: suggestions
  question: Can members suggest topics?
  answer: >-
    Yes. Suggest a topic or project at a meeting. Member requests help us choose
    workshops, challenges, and projects.

- id: register
  question: How do I register?
  answer: >-
    Use the Join button to submit your name, student number, and grade.
    You can also add an email for updates and tell us what you want to build.

- id: privacy
  question: How is my information used?
  answer: >-
    The club will only use your information to contact you about the club. Your
    name and student number are required for registration, but your email is
    optional. We will not share your information with anyone outside of the
    club.
